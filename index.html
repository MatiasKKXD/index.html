<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio en Vivo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1e1b4b, #0f172a);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .player {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 40px 30px;
    width: 100%;
    max-width: 380px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  }
  .disc {
    width: 140px;
    height: 140px;
    margin: 0 auto 25px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #6366f1, #312e81);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 6px rgba(255,255,255,0.05);
    animation: spin 6s linear infinite paused;
  }
  .disc.playing { animation-play-state: running; }
  .disc::after {
    content: '';
    width: 22px;
    height: 22px;
    background: #0f172a;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.3);
  }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  h1 { color: #fff; font-size: 1.3rem; margin-bottom: 6px; }
  .status { color: #a5b4fc; font-size: 0.85rem; margin-bottom: 25px; min-height: 18px; }
  .controls { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 20px; }
  #playBtn {
    width: 64px; height: 64px;
    border-radius: 50%;
    border: none;
    background: #6366f1;
    color: #fff;
    font-size: 1.4rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, transform 0.1s;
  }
  #playBtn:hover { background: #4f46e5; }
  #playBtn:active { transform: scale(0.95); }
  .volume { display: flex; align-items: center; gap: 10px; color: #cbd5e1; font-size: 0.85rem; }
  input[type="range"] {
    -webkit-appearance: none;
    width: 130px;
    height: 4px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #6366f1;
    cursor: pointer;
  }
  .info {
    margin-top: 20px;
    font-size: 0.75rem;
    color: #64748b;
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="player">
  <div class="disc" id="disc"></div>
  <h1>Radio en Vivo</h1>
  <div class="status" id="status">Presioná play para escuchar</div>

  <div class="controls">
    <button id="playBtn">▶</button>
  </div>

  <div class="volume">
    <span>🔉</span>
    <input type="range" id="volumeSlider" min="0" max="100" value="80">
  </div>

  <div class="info">
    SHOUTcast v1 · 212.84.160.3:5261
  </div>
</div>

<audio id="audio" preload="none"></audio>

<script>
  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('playBtn');
  const status = document.getElementById('status');
  const disc = document.getElementById('disc');
  const volumeSlider = document.getElementById('volumeSlider');

  // Posibles URLs de escucha para un servidor SHOUTcast v1
  const streamUrls = [
    'http://212.84.160.3:5261/;',
    'http://212.84.160.3:5261/stream',
    'http://212.84.160.3:5261/'
  ];

  let urlIndex = 0;
  let isPlaying = false;

  audio.volume = 0.8;

  function tryPlay() {
    if (urlIndex >= streamUrls.length) {
      status.textContent = 'No se pudo conectar al servidor';
      resetButton();
      return;
    }
    audio.src = streamUrls[urlIndex];
    status.textContent = 'Conectando...';
    audio.play().catch(() => {
      urlIndex++;
      tryPlay();
    });
  }

  function resetButton() {
    isPlaying = false;
    playBtn.textContent = '▶';
    disc.classList.remove('playing');
  }

  playBtn.addEventListener('click', () => {
    if (isPlaying) {
      audio.pause();
      audio.src = '';
      status.textContent = 'Detenido';
      resetButton();
    } else {
      urlIndex = 0;
      tryPlay();
    }
  });

  audio.addEventListener('playing', () => {
    isPlaying = true;
    playBtn.textContent = '❚❚';
    disc.classList.add('playing');
    status.textContent = 'En vivo ●';
  });

  audio.addEventListener('error', () => {
    if (isPlaying === false && status.textContent === 'Conectando...') {
      urlIndex++;
      tryPlay();
    }
  });

  audio.addEventListener('stalled', () => {
    status.textContent = 'Reconectando...';
  });

  audio.addEventListener('waiting', () => {
    status.textContent = 'Cargando...';
  });

  volumeSlider.addEventListener('input', (e) => {
    audio.volume = e.target.value / 100;
  });
</script>

</body>
</html>
